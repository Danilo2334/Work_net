name: worknet
description: Bolsa de empleo WorkNet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  go_router: 16.3.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep native path providers before FFI build hooks: the current Windows SDK
# cannot compile those hooks when its installation path contains spaces.
dependency_overrides:
  path_provider_foundation: 2.5.1
  path_provider_android: 2.2.20

flutter:
  uses-material-design: true
